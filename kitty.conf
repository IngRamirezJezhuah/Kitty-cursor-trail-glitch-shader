#===============================
#     Djxs4n Cursor Trail
#         Kitty shader
#===============================

# you can choose themes from $HOME/.config/kitty/kitty-themes/
#
include ./kitty-themes/00-Default.conf

#font_family FantasqueSansM Nerd Font Mono Bold
font_family JetBrains Mono, Thin
font_size 11.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.65
dynamic_background_opacity 1
confirm_os_window_close 0

remember_window_size no
initial_width 1100
initial_height 700

# Animated cursor
cursor_trail 100
#cursor_trail_decay 0.5 1.5
cursor_trail_decay 0.3 1.5
cursor_trail_start_threshold 0
cursor_trail_color #3B96A1
custom_shaders cursor-trail-motion-blur cursor-trail-glitch 
#cursor-trail-blaze
cursor_shape beam

cursor_blink_interval 0.5

# change to x11 or wayland or leave auto
linux_display_server wayland

scrollback_lines 1000
wheel_scroll_min_lines 1

#enable_audio_bell no

window_padding_width 4

#selection_foreground none
#selection_background none

#foreground #dddddd
#background #1A1A1A
#cursor #dddddd
